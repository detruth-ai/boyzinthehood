<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYZINTHEHOOD — FROM THE TRENCHES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121216;
            --accent-green: #00ff66;
            --accent-pink: #ff0077;
            --accent-blue: #00d2ff;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --border-color: #22222c;
            --font-heading: 'Syne', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Header & Nav */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent-green);
        }

        .cart-btn-trigger {
            position: relative;
            background: #181820;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-btn-trigger:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .cart-count {
            background: var(--accent-green);
            color: #000;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Hero Banner */
        .hero {
            padding: 4rem 2rem;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 255, 102, 0.05) 0%, rgba(10, 10, 12, 1) 70%);
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        /* Categories Filter */
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            color: #fff;
            border-color: var(--accent-green);
            background: rgba(0, 255, 102, 0.08);
        }

        /* Product Grid */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .product-image-container {
            width: 100%;
            height: 320px;
            background: #1a1a22;
            position: relative;
            overflow: hidden;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 1rem;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-tag {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .product-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        /* Size Selector */
        .size-selector {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
        }

        .size-btn {
            background: #181822;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .size-btn:hover, .size-btn.selected {
            border-color: #fff;
            color: #fff;
            background: #252535;
        }

        .add-cart-btn {
            width: 100%;
            background: var(--text-main);
            color: #000;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .add-cart-btn:hover {
            background: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* Cart Slide-out Drawer */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cart-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        .cart-drawer.active {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-header h2 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            background: #181820;
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            align-items: center;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: #0d0d12;
            border-radius: 8px;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .cart-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-green);
            color: #0
